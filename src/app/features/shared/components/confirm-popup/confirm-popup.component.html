<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
      <div class="bg-white rounded-lg shadow-2xl max-w-md w-full">
        <div class="bg-girardota-teal px-6 py-4 rounded-t-lg">
          <h2 class="text-xl font-bold text-white">Deseas desactivar: {{popupName() }}</h2>
        </div>
        <div class="p-6 space-y-4">
          <p class="text-gray-700">Esta acción no se puede deshacer. ¿Estás seguro de que deseas continuar?</p>
          <div class="flex gap-3 pt-2">
            <button type="button" (click)="onCancel()"
                    class="flex-1 px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50">
              Cancelar
            </button>
            <button (click)="onConfirm()"
                    class="flex-1 px-4 py-2 bg-girardota-teal text-white rounded-lg hover:bg-girardota-teal-dark">
              Confirmar
            </button>
          </div>
</div>
