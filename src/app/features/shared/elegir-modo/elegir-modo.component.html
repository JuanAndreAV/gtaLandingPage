<div class="fixed inset-0 bg-inst-950/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
  <div class="bg-white rounded-xl shadow-2xl max-w-sm w-full overflow-hidden">
    <div class="h-1 bg-inst-gold"></div>
    <div class="p-6">
      <h2 class="text-xl font-bold text-gray-900 mb-1">¿Cómo quieres ingresar?</h2>
      <p class="text-sm text-gray-500 mb-5">Puedes cambiar de perfil cuando quieras desde el menú de usuario.</p>
      <div class="space-y-3">
        <button (click)="entrar('admin')"
                class="w-full flex items-center gap-3 px-4 py-3 border border-gray-200 rounded-lg text-left hover:border-inst-600 hover:bg-inst-50 transition">
          <span class="w-9 h-9 rounded-full bg-inst-100 text-inst-700 flex items-center justify-center">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
          </span>
          <span>
            <span class="block font-semibold text-gray-900">Administrador</span>
            <span class="block text-xs text-gray-500">Gestión académica, usuarios y reportes</span>
          </span>
        </button>
        <button (click)="entrar('profesor')"
                class="w-full flex items-center gap-3 px-4 py-3 border border-gray-200 rounded-lg text-left hover:border-inst-600 hover:bg-inst-50 transition">
          <span class="w-9 h-9 rounded-full bg-inst-100 text-inst-700 flex items-center justify-center">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5zm0 0v6m0-6l6.16-3.422A12.083 12.083 0 0118 18.5c-1.8 1-3.84 1.5-6 1.5s-4.2-.5-6-1.5a12.083 12.083 0 01-.16-7.922L12 14z"/></svg>
          </span>
          <span>
            <span class="block font-semibold text-gray-900">Docente</span>
            <span class="block text-xs text-gray-500">Mi horario, asistencia y novedades</span>
          </span>
        </button>
      </div>
    </div>
  </div>
</div>
